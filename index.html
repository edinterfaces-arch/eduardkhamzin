<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Эдуард Хамзин</title>
  <meta name="description" content="Эдуард Хамзин — Senior Product Designer. AI-assisted. Still employed.">
  <script src="/assets/theme.js"></script>
  <script src="/assets/autograph.js"></script>
  <style>
    :root {
      --space-xs: 4px; --space-sm: 8px; --space-md: 12px; --space-lg: 24px; --space-xl: 32px;
      --type-name: 24px; --leading-name: 28px;
      --type-role: 14px; --leading-role: 20px;
      --type-caption: 13px; --leading-caption: 18px;
      --type-stat: 12px; --leading-stat: 16px;
    }
    * { box-sizing: border-box; }
    html { --bg: #fff; --fg: #111; --muted: #666; --stats: #555; --line: #eee; --track: #e5e5e5; --thumb: #fff; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; color-scheme: light; }
    html[data-theme="dark"] { --bg: #141414; --fg: #f3f3f3; --muted: #aaa; --stats: #bbb; --line: #303030; --track: #505050; --thumb: #f3f3f3; color-scheme: dark; }
    @media (prefers-color-scheme: dark) { html:not([data-theme]) { --bg: #141414; --fg: #f3f3f3; --muted: #aaa; --stats: #bbb; --line: #303030; --track: #505050; --thumb: #f3f3f3; color-scheme: dark; } }
    .theme-switch { position: fixed; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); width: 52px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
    .theme-switch[hidden] { display: none; }
    .theme-track { display: block; width: 42px; height: 24px; border-radius: 20px; background: var(--track); }
    .theme-thumb { display: grid; place-items: center; width: 18px; height: 18px; margin: 3px; border-radius: 50%; background: var(--thumb); color: #333; }
    .theme-switch[aria-checked="true"] .theme-thumb { transform: translateX(18px); }
    .theme-thumb svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    .theme-switch[aria-checked="true"] .sun, .theme-switch[aria-checked="false"] .moon { display: none; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    main { position: relative; z-index: 1; width: 262.55px; max-width: 100%; text-align: center; }
    .autograph-background { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; opacity: .35; pointer-events: none; }
    .autograph-button { position: fixed; z-index: 3; top: max(20px, calc(env(safe-area-inset-top) + 4px)); right: calc(max(16px, env(safe-area-inset-right)) + 56px); display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 18px; background: var(--bg); color: var(--fg); font: inherit; font-size: var(--type-caption); line-height: var(--leading-caption); cursor: pointer; }
    .autograph-button[hidden], .autograph-layer[hidden], .autograph-toolbar[hidden] { display: none; }
    .autograph-button:hover { border-color: var(--muted); }
    .autograph-button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .autograph-layer { position: fixed; inset: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 55%, transparent); }
    .autograph-layer canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    .autograph-toolbar { position: fixed; z-index: 3; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: var(--space-sm); width: max-content; max-width: calc(100vw - 32px); padding: 6px 6px 6px 14px; border: 1px solid var(--line); border-radius: 24px; background: var(--bg); font-size: var(--type-caption); line-height: var(--leading-caption); }
    .autograph-status { color: var(--muted); }
    .autograph-toolbar button { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); color: var(--fg); font: inherit; cursor: pointer; }
    .autograph-toolbar button[data-action="save"] { border-color: var(--fg); background: var(--fg); color: var(--bg); }
    .autograph-toolbar button:disabled { opacity: .4; cursor: default; }
    body.autograph-drawing .theme-switch { visibility: hidden; }
    .portrait { display: block; width: 164px; height: 164px; object-fit: contain; border-radius: 50%; margin: 0 auto var(--space-xl); }
    h1 { margin: 0 0 var(--space-sm); font-size: var(--type-name); font-weight: 500; line-height: var(--leading-name); }
    p { margin: 0; font-size: var(--type-role); font-weight: 400; line-height: var(--leading-role); }
    .approach { margin-top: var(--space-xs); font-size: var(--type-caption); line-height: var(--leading-caption); color: var(--muted); }
    .links { display: flex; justify-content: center; gap: var(--space-md); margin-top: var(--space-md); font-size: var(--type-caption); line-height: var(--leading-caption); }
    .links a { color: var(--muted); text-underline-offset: 3px; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
    .profile-stats { margin-top: var(--space-lg); text-align: left; }
    .stats-row { display: grid; grid-template-columns: minmax(78px, 1fr) auto; gap: var(--space-md); align-items: center; min-height: 44px; padding: 6px 0; border-top: 1px solid var(--line); font-size: var(--type-stat); line-height: var(--leading-stat); }
    .stats-row[hidden] { display: none; }
    .streak-label { font-family: system-ui, sans-serif; color: var(--muted); }
    .stat-number { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .stats-profile { display: inline-flex; align-items: center; gap: 6px; color: var(--stats); }
    .award-badge { display: block; width: 18px; height: 30px; flex-shrink: 0; }
    .stats-row a { color: var(--stats); text-decoration: underline; text-underline-offset: 3px; }
    .stats-row a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .stat-number { display: inline-flex; justify-self: end; align-items: center; gap: 5px; color: var(--stats); font-size: var(--type-stat); white-space: nowrap; }
    .stat-number svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; flex-shrink: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
