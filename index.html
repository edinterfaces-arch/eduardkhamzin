<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Эдуард Хамзин</title>
  <meta name="description" content="Эдуард Хамзин — AI powered Senior Product Designer.">
  <script src="/assets/theme.js"></script>
  <style>
    * { box-sizing: border-box; }
    html { --bg: #fff; --fg: #111; --muted: #666; --stats: #555; --line: #eee; --track: #e5e5e5; --thumb: #fff; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; color-scheme: light; }
    html[data-theme="dark"] { --bg: #141414; --fg: #f3f3f3; --muted: #aaa; --stats: #bbb; --line: #303030; --track: #505050; --thumb: #f3f3f3; color-scheme: dark; }
    @media (prefers-color-scheme: dark) { html:not([data-theme]) { --bg: #141414; --fg: #f3f3f3; --muted: #aaa; --stats: #bbb; --line: #303030; --track: #505050; --thumb: #f3f3f3; color-scheme: dark; } }
    .theme-switch { position: fixed; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); width: 52px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
    .theme-switch[hidden] { display: none; }
    .theme-track { display: block; width: 42px; height: 24px; border-radius: 20px; background: var(--track); }
    .theme-thumb { display: grid; place-items: center; width: 18px; height: 18px; margin: 3px; border-radius: 50%; background: var(--thumb); color: #333; }
    .theme-switch[aria-checked="true"] .theme-thumb { transform: translateX(18px); }
    .theme-thumb svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    .theme-switch[aria-checked="true"] .sun, .theme-switch[aria-checked="false"] .moon { display: none; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    main { text-align: center; }
    .portrait { display: block; width: 164px; height: 164px; object-fit: contain; border-radius: 50%; margin: 0 auto 32px; }
    h1 { margin: 0 0 10px; font-size: 24px; font-weight: 500; line-height: 1.4; }
    p { margin: 0; font-size: clamp(13px, 3.6vw, 16px); font-weight: 400; line-height: 1.6; }
    .links { display: flex; justify-content: center; gap: 18px; margin-top: 10px; font-size: 14px; }
    .links a { color: var(--muted); text-underline-offset: 3px; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
    .codex-stats { margin: 24px auto 0; padding-top: 0; border-top: 1px solid var(--line); max-width: 330px; text-align: left; }
    .codex-streak { grid-column: 2; }
    .codex-stats .stats-row + .stats-row { border-top: 1px solid var(--line); }
    .github-count { grid-column: 2; }
    .streak-label { font-family: var(--streak-label-font, system-ui, sans-serif); color: var(--muted); }
    .stat-number { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .social-stats { margin: 24px auto 0; padding-top: 0; border-top: 1px solid var(--line); max-width: 330px; text-align: left; }
    .codex-stats + .social-stats { margin-top: 0; padding-top: 0; }
    .stats-platform + .stats-platform { border-top: 1px solid var(--line); }
    .stats-row { display: grid; grid-template-columns: minmax(78px, 1fr) auto; gap: 12px; align-items: center; min-height: 44px; padding: 7px 0; font-size: 12px; line-height: 1.6; }
    .stats-profile { display: inline-flex; align-items: center; gap: 6px; }
    .award-badge { display: block; width: 18px; height: 30px; flex-shrink: 0; }
    .stats-row a { color: var(--stats); text-decoration: underline; text-underline-offset: 3px; }
    .stats-row a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .stat-number { display: inline-flex; justify-self: end; align-items: center; gap: 5px; color: var(--stats); font-size: 12px; white-space: nowrap; }
    .stat-number svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; flex-shrink: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 350px) { .stats-row { gap: 12px; font-size: 12px; } }
  </style>
</head>
<body>
  <button class="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Тёмная тема" hidden>
    <span class="theme-track" aria-hidden="true"><span class="theme-thumb">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M20 14a8.5 8.5 0 0 1-10-10 8.5 8.5 0 1 0 10 10Z"/></svg>
    </span></span>
  </button>
  <main>
    <img class="portrait" src="/assets/portrait-current.jpg" alt="Эдуард Хамзин" width="640" height="640">
    <h1>Эдуард Хамзин</h1>
    <p lang="en">AI powered Senior Product Designer</p>
    <p class="links"><a href="https://t.me/eduard_khamzin" target="_blank" rel="noopener noreferrer">Telegram</a></p>
    <section class="codex-stats" lang="en" aria-label="Coding activity">
      <div class="stats-row">
        <span class="stats-profile"><a href="https://chatgpt.com/u/iriska1337" target="_blank" rel="noopener noreferrer">Codex</a></span>

      </div>
      <div class="stats-row">
        <span class="stats-profile"><a href="https://github.com/edinterfaces-arch" target="_blank" rel="noopener noreferrer">GitHub</a></span>
        <div class="stat-number github-count"><span><!-- github-stats:start -->83<!-- github-stats:end --></span><span class="streak-label">contributions</span></div>
      </div>
    </section>
    <!-- social-stats:start -->
    <section class="social-stats" lang="en" aria-label="Project views">
      <div class="stats-platform" data-scope="profile" title="Обновлено: 2026-11-09T00:49:40+00:00">
        <div class="stats-row"><span class="stats-profile"><a href="https://www.behance.net/khamzin" target="_blank" rel="noopener noreferrer">Behance</a><svg class="award-badge" viewBox="0 0 24 40" role="img" aria-label="Награда Behance"><title>Награда Behance</title><path d="M0 0H24V39L12 32L0 39Z" fill="#ae945b"/><text x="12" y="24" fill="#fff" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Gr</text></svg></span><span class="stat-number">50 540 <span class="streak-label">views</span></span></div>
      </div>

        <div class="stats-row"><span class="stats-profile"><a href="https://dribbble.com/adooarde" target="_blank" rel="noopener noreferrer">Dribbble</a></span><span class="stat-number">64 600 <span class="streak-label">views</span></span></div>
      </div>
    </section>
    <!-- social-stats:end -->
  </main>
</body>
</html>
