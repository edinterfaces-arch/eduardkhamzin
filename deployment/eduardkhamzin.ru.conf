server {
    listen 80;
    listen [::]:80;
    server_name eduardkhamzin.ru www.eduardkhamzin.ru;
    root /var/www/eduardkhamzin.ru;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://eduardkhamzin.ru$request_uri; }
}
server {
    listen 127.0.0.1:8444 ssl;
    server_name www.eduardkhamzin.ru;
    ssl_certificate /etc/letsencrypt/live/eduardkhamzin.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eduardkhamzin.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://eduardkhamzin.ru$request_uri;
}
server {
    listen 127.0.0.1:8444 ssl;
    server_name eduardkhamzin.ru;
    root /var/www/eduardkhamzin.ru;
    index index.html;
    charset utf-8;
    ssl_certificate /etc/letsencrypt/live/eduardkhamzin.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eduardkhamzin.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; script-src 'self'; connect-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location / { try_files $uri $uri/ =404; }
    location = /api/autographs {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
    }
}
