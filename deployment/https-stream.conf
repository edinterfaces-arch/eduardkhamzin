stream {
    map $ssl_preread_server_name $eduard_backend {
        eduardkhamzin.ru     127.0.0.1:8444;
        www.eduardkhamzin.ru 127.0.0.1:8444;
        default             127.0.0.1:443;
    }
    server {
        listen 8443;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
        proxy_pass $eduard_backend;
    }
}
